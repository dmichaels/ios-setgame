# Put this file (on our AWS LightSail server) in: /etc/nginx/sites-available/dmichaels.dev
# Check and restart nginx like this: sudo nginx -t ; sudo systemctl reload nginx
# Run the our Python scripts e.g.:
# - python3 ios_set_game_server.py --port 8000      > ios_set_game_server.log 2>&1 &
# - python3 ios_set_game_server_beta.py --port 8001 > ios_set_game_server_beta.log 2>&1 &

server {
    listen 80;
    server_name dmichaels.dev;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dmichaels.dev;

    # SSL Certs (assumes certbot already ran successfully)
    ssl_certificate     /etc/letsencrypt/live/dmichaels.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dmichaels.dev/privkey.pem;

    # Homepage - static HTML
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Forward /apis/logicard/beta to port 8001
    location /apis/logicard/beta/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Python backend - proxy /apis/logicard to local server
    location /apis/logicard/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
